[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-restore"
version = "0.2.0"
description = "Windows-first fast resume & session registry manager for AI Agent fleets (Claude, Codex, Cursor, Antigravity, Hermes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SanHsien", email = "sanhsien@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
rich = [
    "rich>=13.0.0",  # freshness-hold: optional runtime extra; the floor is the compatibility promise to users with older rich
]

[project.scripts]
asr = "agent_session_restore.cli:main"
csr = "agent_session_restore.cli:main"
agent-session-restore = "agent_session_restore.cli:main"
claude-session-restore = "agent_session_restore.cli:main"

[tool.uv]
package = true
link-mode = "copy"
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[dependency-groups]
# 開發閘門已驗證的工具基準；與已審查的 uv.lock 保持一致。
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
platform = "win32"
strict = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
